name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Provide the client configuration template
        run: cp .env.example .env
      - name: Enforce dependency lockfile
        run: flutter pub get --enforce-lockfile
      - name: Validate release configuration
        run: dart run tool/release_config_validator.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Check landing page structure
        run: python3 tool/check_landing.py
      - name: Test the tool checks
        run: python3 -m unittest discover -s tool -p "*_test.py"
      - name: Test
        run: flutter test
      - name: Check tracked build inputs
        run: python3 tool/check_tracked_inputs.py

  firestore-rules:
    name: Firestore rules emulator suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rules_test
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rules_test/package-lock.json
      # The runner image ships an older JDK (17) and firebase-tools 15 refuses
      # anything below Java 21, so the emulator does not start without this.
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - name: Install pinned dependencies
        run: npm ci
      - name: Run Firestore rules suite against the emulator
        run: npx firebase emulators:exec --only firestore --project demo-travelready "npm test"

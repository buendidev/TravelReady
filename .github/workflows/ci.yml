name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Provide the client configuration template
        run: cp .env.example .env
      - name: Enforce dependency lockfile
        run: flutter pub get --enforce-lockfile
      - name: Validate release configuration
        run: dart run tool/release_config_validator.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Check landing page structure
        run: python3 tool/check_landing.py
      - name: Test the tool checks
        run: python3 -m unittest discover -s tool -p "*_test.py"
      - name: Test
        run: flutter test
      - name: Check tracked build inputs
        run: python3 tool/check_tracked_inputs.py

name: travel_ready
description: "TravelReady! - Aplicación móvil de planificación de viajes. TravelReady - Pablo Buendicho Ortín"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.1

  # ── Base de Datos (SQLite) ────────────────────────────────────────────
  sqflite: ^2.3.0
  path: ^1.9.0
  crypto: ^3.0.3

  # ── Estado ────────────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # ── Navegación ────────────────────────────────────────────────────────
  go_router: ^17.2.1

  # ── Inyección ─────────────────────────────────────────────────────────
  get_it: ^9.2.1
  injectable: ^3.0.0

  # ── Funcional ─────────────────────────────────────────────────────────
  fpdart: ^1.1.0

  # ── UI ────────────────────────────────────────────────────────────────
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # ── Conectividad ──────────────────────────────────────────────────────
  connectivity_plus: ^7.1.1

  # ── Entorno ───────────────────────────────────────────────────────────
  flutter_dotenv: ^6.0.0

  # ── Red ───────────────────────────────────────────────────────────────
  http: ^1.2.2
  dio: ^5.7.0

  # ── Utilidades ────────────────────────────────────────────────────────
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.0
  uuid: ^4.4.2
  url_launcher: ^6.3.1

  # ── Notificaciones locales ────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── Suscripciones ─────────────────────────────────────────────────────
  purchases_flutter: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  injectable_generator: ^3.0.2
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env

# Configuración de iconos de la app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#006571"
  min_sdk_android: 21
